# Publish cold-backup to npm from a GitHub Release.
#
# Authentication uses npm trusted publishing (OIDC), so no NPM_TOKEN secret is stored here.
# Configure it once on npm after the package exists:
#
#   Package → Settings → Trusted Publisher → GitHub Actions
#     Organization or user : haotian-lu-prog
#     Repository           : cold-backup
#     Workflow filename    : publish.yml
#     Environment          : (leave empty)
#
# Releasing: bump "version" in package.json, commit, tag `v<version>`, push the tag, then publish
# a GitHub Release for that tag. The tag must agree with package.json, and a version already on
# the registry is skipped — so a manual `workflow_dispatch` run is a safe rehearsal that only tests.
#
# This package has **no dependencies**: the payload is one bash script. The tests are the same
# ones CI runs (`npm test`), so what is published is what was tested.

name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm trusted publishing and provenance.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Require npm 11.5.1 or later for trusted publishing
        run: |
          node -e '
            const { execSync } = require("node:child_process")
            const version = execSync("npm --version").toString().trim()
            console.log(`npm ${version}`)
            const [major, minor] = version.split(".").map(Number)
            if (major < 11 || (major === 11 && minor < 5)) {
              console.error("npm 11.5.1 or later is required for trusted publishing")
              process.exit(1)
            }
          '

      - name: Test (lint + end-to-end, all in temp dirs)
        run: npm test

      - name: Check the release tag against package.json
        if: ${{ github.event_name == 'release' }}
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node -e '
            const { version } = require("./package.json")
            const tag = process.env.RELEASE_TAG
            if (tag !== `v${version}`) {
              console.error(`release tag ${tag} does not match package.json ${version}`)
              process.exit(1)
            }
            console.log(`release tag ${tag} matches package.json`)
          '

      - name: Check whether this version is already published
        id: registry
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "cold-backup@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "cold-backup@$version is already on the registry — nothing to publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: ${{ github.event_name == 'release' && steps.registry.outputs.published == 'false' }}
        run: npm publish --ignore-scripts --provenance --access public
