name: ci

# 真正的闸门：两个平台都跑一遍。macOS 上**必须**用 /bin/bash（3.2）跑，
# 因为 macOS 的定时任务/ git 钩子常常就是它；本地开发终端里的 Homebrew bash 5 覆盖不到这个坑。
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            note: Linux + GNU stat/date/sha256sum
          - os: macos-latest
            note: macOS + BSD stat/date/shasum, bash 3.2
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: 语法检查
        run: |
          set -e
          bash -n bin/dev-backup
          bash -n install.sh
          bash -n test/lint.sh
          bash -n test/selftest.sh
          bash -n test/frozen-clock.sh

      - name: macOS 上再用系统 bash 3.2 检查一遍
        if: runner.os == 'macOS'
        run: /bin/bash -n bin/dev-backup

      - name: 静态检查（跨平台陷阱 / 契约一致性 / 无个人路径）
        run: bash test/lint.sh

      - name: 端到端自测（只在临时目录里造数据）
        run: bash test/selftest.sh

      - name: macOS 上用 bash 3.2 再跑一遍端到端
        if: runner.os == 'macOS'
        run: /bin/bash test/selftest.sh

      # 冻结时钟：把产物名里的 UTC 时间戳钉成同一个值，强制制造「同一秒内为多个提交各备一次」
      # 的并列情况。真实机器上这是时序巧合（ubuntu 够快会撞上、macOS 不会），
      # 于是「按名取最新」这类假设只在 CI 上抽签式地红 —— 这一步把那巧合变成常态。
      - name: 冻结时钟压力测试（同秒并列成为常态）
        run: bash test/frozen-clock.sh

      - name: macOS 上再用 bash 3.2 跑一遍冻结时钟
        if: runner.os == 'macOS'
        run: /bin/bash test/frozen-clock.sh
